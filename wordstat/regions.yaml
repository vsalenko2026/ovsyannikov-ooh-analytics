# Справочник регионов: наше название -> ID Вордстата -> тип (кампания / контроль).
#
# Файл собирается командой `python3 run.py regions resolve` из ответа
# GetRegionsTree. Руками правится только периметр (name / match / type /
# cities / screens / campaign_start); поле region_id заполняет скрипт.
#
# Уровень (город или область) — общий для обеих групп, см. meta.level.

meta:
  level: oblast
  decision: >-
    Берём субъект федерации целиком — и в кампании, и в контроле. Причина:
    контрольная группа изначально набрана областями (ТЗ, п. 9.2), а сравнивать
    город с областью нельзя. Порог пригодности контроля (20 брендовых запросов
    в месяц) на городском уровне не выдерживается почти нигде.
  perimeter_source: >-
    Фактический список размещения на 17.07.2026 (досье, п. 6.2). Города
    свёрнуты в субъекты федерации; поле cities хранит исходные города,
    screens — число экранов по досье.
  campaign_start_default: '2026-07-17'
  control_note: >-
    Семь областей без размещения, по одной на федеральный округ кампании.
    Краснодарский край в контроль не берём — у клиента там представительство.
  resolved_at: null
  regions_tree_fetched_at: null

