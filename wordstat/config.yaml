# Конфигурация выгрузки. Периметр меняется здесь, код не трогаем.

api:
  base_url: https://searchapi.api.cloud.yandex.net/v2/wordstat
  # Лимит сервиса ~5–10 RPS; пауза между вызовами — вежливость и защита от 429.
  pause_seconds: 0.3
  max_attempts: 5
  backoff_base_seconds: 2      # 2 / 4 / 8 / 16 с, потолок 60 с
  timeout_seconds: 30
  # Тариф GetDynamics по ТЗ: 20 ₽ за 1000 вызовов. Считается только для лога
  # стоимости; расхождение с фактическим тарифом — см. README.
  price_per_call_rub: 0.02

series:
  # Понедельник. Ряд должен покрывать окно «до» ярославского пилота
  # (01.04–03.06.2026), поэтому начинаем с конца марта.
  start_date: '2026-03-30'
  # null — до последней недели; верхняя граница выравнивается на конец недели.
  end_date: null
  period: PERIOD_WEEKLY
  # auto — определить по датам в ответе API, с какого края недели ставится дата.
  # Руками можно зафиксировать start или end, если решение уже принято.
  week_anchor: auto
  # Текущую незакрытую неделю по умолчанию не запрашиваем. Если включить,
  # она попадёт в выгрузку с пометкой is_partial=1.
  include_current_period: false
  devices:
    - DEVICE_ALL

# Ядро метрики. Не менять без согласования: на этих трёх фразах построены
# все ранее опубликованные множители.
phrases:
  - овсянников мыло
  - овсянников косметика
  - овсянников купить

regions_file: regions.yaml

paths:
  raw: raw
  output: output
